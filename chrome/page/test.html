<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSZhuyin Chrome Extension — Test Page</title>
<style>
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1f2937;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .note { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
  .test-group { margin-bottom: 24px; }
  .test-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
  input, textarea { width: 100%; padding: 8px 12px; font-size: 16px; border: 1px solid #d4d4d8; border-radius: 6px; box-sizing: border-box; }
  textarea { height: 80px; resize: vertical; }
  [contenteditable] {
    width: 100%; padding: 8px 12px; font-size: 16px;
    border: 1px solid #d4d4d8; border-radius: 6px; min-height: 36px;
    background: #fff;
  }
  .status { margin-top: 16px; padding: 8px 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; font-size: 14px; color: #166534; }
  .status.loading { background: #fefce8; border-color: #fef08a; color: #854d0e; }
</style>
</head>
<body>

<h1>JSZhuyin Web IME — Test Page</h1>
<p class="note">
  此頁用於測試 Chrome 擴充套件的注音輸入功能。<br>
  標準注音鍵盤：<b>1ㄅ 2ㄉ 3ˇ(三聲) 4ˋ(四聲) 5ㄓ 6ˊ(二聲) 7˙(輕聲) 8ㄚ 9ㄞ 0ㄢ -ㄦ =＝</b>
  (詳見 <a href="https://github.com/timdream/jszhuyin" target="_blank">jszhuyin README</a>)<br>
  確認字：<b>Enter</b> · 選字：<b>Shift+數字</b> · 取消：<b>Esc</b>
</p>

<div class="test-group">
  <label>&lt;input type="text"&gt;</label>
  <input type="text" id="input1" placeholder="輸入注音 e.g. 打字 ㄅ=1，ㄉ=2，ˋ=4 → 按 1 2 4">
</div>

<div class="test-group">
  <label>&lt;textarea&gt;</label>
  <textarea id="textarea1" placeholder="試試多行..."></textarea>
</div>

<div class="test-group">
  <label>contenteditable div</label>
  <div contenteditable="true" id="ce1">可在這裡打字...</div>
</div>

<div class="status" id="status">載入引擎中...</div>

<script>
  var statusEl = document.getElementById('status');
  function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (ok === false ? ' loading' : '');
  }

  // If this page is opened via file://, the content script won't inject.
  // Provide a direct-load fallback.
  if (typeof ImeClient === 'undefined') {
    setStatus('請以 Chrome 擴充套件方式載入此頁（chrome://extensions → 載入未封裝 → 選擇 jsZhuyin-chrome 目錄）', false);
  } else {
    setStatus('擴充套件已載入。請點擊瀏覽器工具列圖示啟用注音輸入，然後在上方輸入框打字。');
  }

  // FIXME: 要驗證所有路徑可被 Chrome 讀取, 用 console.log 或 network panel

  document.querySelectorAll('input, textarea, [contenteditable]').forEach(function(el) {
    el.addEventListener('focus', function() {
      console.log('[test] focused:', el.id || el.tagName);
    });
    el.addEventListener('input', function(evt) {
      console.log('[test] input on', el.id || el.tagName, ':', evt.inputType, evt.data);
    });
  });
</script>
</body>
</html>
