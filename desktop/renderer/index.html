<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <title>浮動注音</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      user-select: none;
    }
    body { background: transparent; outline: none; padding: 4px; }

    /* 假盒子：shadow + 圓角 + 半透明背景，包住整個卡片 */
    .fake-box {
      position: relative;
      width: 100%; height: 100%;
      background: rgba(255,255,255,1);
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    .card {
      width: 100%; height: 100%;
      background: #ffffff;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    body:focus .card {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.25), 0 6px 20px rgba(0,0,0,0.18);
    }

    /* ===== 標題列 ===== */
    .titlebar {
      -webkit-app-region: drag;
      display: flex; align-items: center;
      height: 28px; padding: 0 6px 0 10px;
      background: linear-gradient(#f8fafc, #f1f5f9);
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .titlebar .app-name { font-size: 12px; font-weight: 600; color: #334155; }
    .titlebar .app-name .zhin { color: #3b82f6; }
    .titlebar .spacer { flex: 1; }
    .ime-status {
      font-size: 10px; font-weight: 600; padding: 2px 6px;
      border-radius: 3px; margin-right: 4px; white-space: nowrap;
    }
    .ime-status.on { background: #dbeafe; color: #2563eb; }
    .ime-status.off { background: #f1f5f9; color: #94a3b8; }
    .copy-flash {
      font-size: 11px; font-weight: 500; color: #16a34a;
      opacity: 0; transition: opacity 0.25s; white-space: nowrap;
    }
    .copy-flash.show { opacity: 1; }

    .btn-settings {
      -webkit-app-region: no-drag;
      width: 22px; height: 22px; border: none; border-radius: 4px;
      background: transparent; color: #94a3b8; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-settings:hover { background: #e2e8f0; color: #475569; }

    /* ===== 設定面板 ===== */
    .settings-panel {
      display: none;
      flex-shrink: 0;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .settings-panel.visible { display: block; }
    .settings-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-label { font-size: 12px; color: #475569; white-space: nowrap; }
    .hotkey-display {
      flex: 1; font-size: 12px; font-family: monospace;
      padding: 3px 8px; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 4px; color: #334155; min-width: 0;
    }
    .btn-record {
      height: 24px; padding: 0 10px; border: 1px solid #3b82f6;
      border-radius: 4px; background: #fff; color: #3b82f6;
      font-size: 11px; font-weight: 500; cursor: pointer;
      white-space: nowrap;
    }
    .btn-record:hover { background: #eff6ff; }
    .btn-record.recording {
      background: #ef4444; color: #fff; border-color: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .hotkey-msg { font-size: 11px; margin-top: 4px; min-height: 16px; }
    .hotkey-msg.ok { color: #16a34a; }
    .hotkey-msg.error { color: #ef4444; }

    /* 外觀設定 */
    .settings-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; }
    .settings-section-title { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
    .slider-row { display: flex; align-items: center; gap: 8px; }
    .slider-row input[type="range"] { flex: 1; height: 4px; accent-color: #3b82f6; }
    .slider-val { font-size: 11px; color: #64748b; min-width: 32px; text-align: right; }
    .color-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .color-swatch {
      width: 22px; height: 22px; border-radius: 4px; border: 2px solid transparent;
      cursor: pointer; transition: border-color 0.15s;
    }
    .color-swatch:hover, .color-swatch.active { border-color: #3b82f6; }

    /* ===== IME 組字 + 候選 ===== */
    .ime {
      flex-shrink: 0;
      padding: 6px 10px 8px;
      display: flex; flex-direction: column; gap: 4px;
      border-bottom: 1px solid #f1f5f9;
    }
    .composition-line { display: none; align-items: baseline; gap: 6px; }
    .composition-line.visible { display: flex; }
    .composition-label { font-size: 11px; color: #9ca3af; white-space: nowrap; }
    .composition-text {
      font-size: 18px; font-weight: 500; color: #3b82f6;
      border-bottom: 2px solid #3b82f6; padding-bottom: 1px; letter-spacing: 1px;
    }
    .candidates-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .candidate-item {
      display: inline-flex; align-items: baseline; gap: 2px;
      padding: 2px 8px; background: #f4f4f5; border-radius: 4px;
      cursor: pointer; transition: background 0.1s; font-size: 14px;
    }
    .candidate-item:hover { background: #e4e4e7; }
    .candidate-item.selected { background: #3b82f6; color: #fff; }
    .candidate-index { font-size: 10px; color: #a1a1aa; margin-right: 1px; }
    .candidate-item.selected .candidate-index { color: rgba(255,255,255,0.7); }
    .pagination {
      display: none; align-items: center; justify-content: center;
      gap: 8px; font-size: 11px; color: #a1a1aa;
    }
    .pagination.visible { display: flex; }

    /* ===== 文字編輯區 ===== */
    .text-area {
      width: 100%; border: none; outline: none; resize: none;
      padding: 8px 10px; min-height: 60px; overflow-y: auto;
      font-family: inherit; font-size: 14px; line-height: 1.6;
      color: #1e293b; background: transparent;
      user-select: text; -webkit-user-select: text;
    }
    .text-area::placeholder { color: #cbd5e1; }
    /* ===== 邊緣拖拉漸層提示（已改為外框常駐漸層） ===== */

    .text-area::-webkit-scrollbar { width: 5px; }
    .text-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body tabindex="0">
  <div class="fake-box" id="fake-box">
  <div class="card" id="card">
    <!-- 標題列 -->
    <div class="titlebar">
      <span class="app-name"><span class="zhin">注音</span> IME</span>
      <div class="spacer"></div>
      <span class="ime-status on" id="ime-status">注音 ON</span>
      <span class="copy-flash" id="copy-flash">已複製 ✓</span>
      <button class="btn-settings" id="btn-settings" title="設定">⚙</button>
    </div>

    <!-- 設定面板 -->
    <div class="settings-panel" id="settings-panel">
      <div class="settings-row">
        <span class="settings-label">顯示/隱藏</span>
        <span class="hotkey-display" id="hotkey-display">Ctrl+`</span>
        <button class="btn-record" id="btn-record">設定</button>
      </div>
      <div class="hotkey-msg" id="hotkey-msg"></div>

      <!-- 外觀設定 -->
      <div class="settings-section">
        <div class="settings-section-title">外觀</div>
        <div class="slider-row">
          <span class="settings-label">陰影濃度</span>
          <input type="range" id="opacity-slider" min="0" max="100" value="25">
          <span class="slider-val" id="opacity-val">25%</span>
        </div>
        <div class="color-row">
          <span class="settings-label">陰影顏色</span>
          <div class="color-swatch active" data-color="#000000" style="background:#000000" title="黑色"></div>
          <div class="color-swatch" data-color="#1e293b" style="background:#1e293b" title="深灰"></div>
          <div class="color-swatch" data-color="#3b82f6" style="background:#3b82f6" title="藍色"></div>
          <div class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6" title="紫色"></div>
          <div class="color-swatch" data-color="#059669" style="background:#059669" title="綠色"></div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">陰影 & 圓角</div>
          <div class="slider-row">
            <span class="settings-label">模糊半徑</span>
            <input type="range" id="blur-slider" min="0" max="60" value="24">
            <span class="slider-val" id="blur-val">24</span>
          </div>
          <div class="slider-row" style="margin-top:4px">
            <span class="settings-label">偏移距離</span>
            <input type="range" id="offset-slider" min="0" max="30" value="4">
            <span class="slider-val" id="offset-val">4</span>
          </div>
          <div class="slider-row" style="margin-top:4px">
            <span class="settings-label">圓角</span>
            <input type="range" id="radius-slider" min="0" max="30" value="10">
            <span class="slider-val" id="radius-val">10</span>
          </div>
        </div>
        <div style="margin-top:8px;text-align:right">
          <button class="btn-record" id="btn-reset" style="border-color:#94a3b8;color:#64748b">還原預設</button>
        </div>
      </div>
    </div>

    <!-- IME 組字 + 候選 -->
    <div class="ime">
      <div class="composition-line" id="composition-line">
        <span class="composition-label">組字</span>
        <span class="composition-text" id="composition-text"></span>
      </div>
      <div class="candidates-list" id="candidates"></div>
      <div class="pagination" id="pagination"><span id="page-info"></span></div>
    </div>

    <!-- 文字編輯區 -->
    <textarea class="text-area" id="text-area"
      placeholder="右 Shift 切換注音開關，Ctrl+C 複製"
      rows="5"></textarea>
  </div>
  </div><!-- /fake-box -->

  <script src="lib/bopomofo_encoder.js"></script>
  <script src="lib/jszhuyin_data_pack.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/jszhuyin.js"></script>
  <script src="lib/data_loader.js"></script>
  <script src="lib/ime-client.js"></script>
  <script src="lib/layout-mapper.js"></script>
  <script src="ime.js"></script>
</body>
</html>
